# CheveluAI — single-service deployment (frontend + API in one container).
# Works as a Dokploy "Compose" application. Point your Dokploy domain at this
# service on port 8000; Dokploy's Traefik handles TLS and routing.
services:
  cheveluai:
    build:
      context: .
      dockerfile: Dockerfile
    image: cheveluai:latest
    restart: unless-stopped
    environment:
      # SQLite database location (persisted via the volume below)
      CHEVELUAI_DB: /data/cheveluai.db
    volumes:
      - cheveluai-data:/data
    ports:
      # host:container — drop/adjust if Dokploy routes to the container directly
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  cheveluai-data:

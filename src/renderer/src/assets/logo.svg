<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- AMOS placeholder mark: a hub node wired to three satellites. Fixed
       colours (brand navy / cream / green) so it works as a favicon and as the
       source geometry for the packaged app icon. The in-app version lives in
       src/renderer/src/components/Logo.tsx and follows the theme instead. -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#001e2b" />
  <g stroke="#fffeeb" stroke-width="3.2" stroke-linecap="round" opacity="0.45">
    <line x1="32" y1="32" x2="32" y2="12" />
    <line x1="32" y1="32" x2="14.68" y2="42" />
    <line x1="32" y1="32" x2="49.32" y2="42" />
  </g>
  <g fill="#fffeeb">
    <circle cx="32" cy="12" r="4.6" />
    <circle cx="14.68" cy="42" r="4.6" />
    <circle cx="49.32" cy="42" r="4.6" />
  </g>
  <circle cx="32" cy="32" r="7" fill="#00ed64" />
</svg>
